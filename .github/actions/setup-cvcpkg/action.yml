name: Set up cvcpkg
description: >
  The cvcpkg CLI from cy-pca/cvcpkg (master unless a ref is given) on Python 3.12, as
  cy-pca/nicotina's CI installs it.
inputs:
  ref:
    description: cy-pca/cvcpkg branch, tag or commit to install the CLI from.
    default: master
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - shell: bash
      env:
        CVCPKG_CLI_REF: ${{ inputs.ref }}
      run: |
        python -m pip install --quiet "cvcpkg @ git+https://github.com/cy-pca/cvcpkg@${CVCPKG_CLI_REF}"
        echo "cvcpkg: $(command -v cvcpkg) $(cvcpkg --version)"
